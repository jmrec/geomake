[project]
name = "geomake"
version = "0.1.0"
description = "Build geospatial datasets from a manifest of cached, ordered CLI steps."
readme = "README.md"
license = "MIT"
keywords = [
    "geospatial",
    "gis",
    "geojson",
    "pmtiles",
    "vector-tiles",
    "maplibre",
    "tippecanoe",
    "mapshaper",
    "data-pipeline",
    "manifest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Build Tools",
]
authors = [
    { name = "Juan Miguel Recondo", email = "134484809+jmrec@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.29.2",
    "structlog>=26.1.0",
    "pydantic>=2.14.4",
]

[project.urls]
Documentation = "https://docs.jmrecondo.com/geomake/"
Repository = "https://github.com/jmrec/geomake"
Changelog = "https://github.com/jmrec/geomake/blob/main/CHANGELOG.md"

[project.scripts]
geomake = "geomake.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.20.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "zensical>=0.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
