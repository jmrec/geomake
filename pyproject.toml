[project]
name = "geomake"
version = "0.1.0"
description = "Build geospatial datasets from a manifest of cached, ordered CLI steps."
readme = "README.md"
authors = [
    { name = "Juan Miguel Recondo", email = "134484809+jmrec@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.29.2",
    "structlog>=26.1.0",
    "pydantic>=2.14.4",
]

[project.scripts]
geomake = "geomake.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "zensical>=0.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
