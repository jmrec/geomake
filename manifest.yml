datasets:
  regions:
    source: raw/regions/*.json
    steps:
      - run: >
          mapshaper -i {in} -clean
          -o {out} precision=0.00001
      - run: >
          tippecanoe -o {out} -f -P
          --layer=regions -Z4 -z14
          --simplify-only-low-zooms
          --detect-shared-borders
          --coalesce-densest-as-needed
          {in}
        out: regions.pmtiles
